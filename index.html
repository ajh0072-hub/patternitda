<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>패턴잇다</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#eef0f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="패턴잇다">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
/* Layout: title bar, ribbon, option strip, three-pane workspace, status bar. */
:root{--mat:#fff;--grid:#eef1f3;--grid2:#d8dfe4;--ink:#1d2428;--draw:#0a6fb0;--seam:#c9259a;--mark:#e4570a;--c1:#1f5fd0;--c2:#d62828;--c3:#c9259a;--c4:#1a9e4b;--c5:#0a9fb5;--c6:#b58900;--chrome:#eef0f1;--panel:#f7f8f8;--line:#d5dade;--dim:#667078;--active:#d6ebf8;--danger:#b3261e;color-scheme:light;--font:"IBM Plex Sans KR","Malgun Gothic",system-ui,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--chrome);color:var(--ink);font:13px/1.35 var(--font);overflow:hidden;overscroll-behavior:none}
#app{height:100%;display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto}
button,label.btn{font:inherit;color:inherit;background:none;border:0;border-radius:5px;cursor:pointer;touch-action:manipulation}
button:focus-visible,label.btn:focus-within,input:focus-visible,select:focus-visible{outline:2px solid var(--draw);outline-offset:1px}
button:disabled{opacity:.38;cursor:default}
svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
#title{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:calc(4px + env(safe-area-inset-top)) 12px 2px}
#quick{display:flex;gap:2px}
#quick button,#quick label.btn{width:30px;height:28px;display:grid;place-items:center}
#quick svg{width:18px;height:18px}
#quick button:hover:not(:disabled),#quick label.btn:hover{background:var(--line)}
#name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
#name small{font-weight:400;color:var(--dim);margin-left:6px}
#tabs{display:flex;gap:2px;padding:0 12px}
#tabs button{padding:5px 13px;border-bottom:2px solid transparent;border-radius:0}
#tabs button[aria-selected=true]{font-weight:600;border-bottom-color:var(--draw)}
#ribbon{background:var(--mat);margin:2px 8px 0;border-radius:8px;display:flex;overflow-x:auto;min-height:88px}
.tabpane{display:flex}
.group{display:grid;grid-template-rows:1fr auto;padding:5px 7px 3px;border-right:1px solid var(--line)}
.group:last-child{border-right:0}
.tools{display:flex;gap:2px}
.group>span{text-align:center;color:var(--dim);font-size:11px}
.tool{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:52px;height:60px;padding:3px 5px;font-size:12px;white-space:nowrap}
.tool:hover:not(:disabled){background:var(--chrome)}
.tool[aria-pressed=true]{background:var(--active);box-shadow:inset 0 0 0 1px var(--draw)}
#options{display:flex;align-items:center;gap:14px;padding:6px 12px;overflow-x:auto;white-space:nowrap}
#options label{display:inline-flex;align-items:center;gap:5px}
select{font:inherit;height:26px;background:var(--mat);color:var(--ink);border:1px solid var(--line);border-radius:4px}
#work{display:grid;grid-template-columns:230px minmax(0,1fr) 210px;gap:6px;padding:0 8px;min-height:0}
#work.noLeft{grid-template-columns:minmax(0,1fr) 210px}
#work.noRight{grid-template-columns:230px minmax(0,1fr)}
#work.noLeft.noRight{grid-template-columns:minmax(0,1fr)}
#work.noLeft #leftPanel,#work.noRight #rightPanel{display:none}
aside{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:auto;min-height:0}
aside h2{margin:0;padding:7px 10px;font-size:12px;font-weight:600;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
#layerHead,.layerRow{display:grid;grid-template-columns:38px minmax(0,1fr) 54px 40px;align-items:center;padding:5px 10px;text-align:center}
#layerHead{color:var(--dim);font-size:11px;border-bottom:1px solid var(--line)}
.layerRow{border-bottom:1px solid var(--line)}
.layerRow:nth-child(even){background:var(--mat)}
.layerRow span:nth-child(2){text-align:left;font-weight:600}
.layerRow span:nth-child(3){font-variant-numeric:tabular-nums;color:var(--dim)}
.hint{margin:10px;color:var(--dim);font-size:12px}
aside h3{margin:0;padding:5px 10px;font-size:12px;font-weight:600;background:var(--chrome)}
aside label.row{display:flex;align-items:center;gap:8px;padding:5px 12px}
input[type=checkbox],input[type=radio]{width:15px;height:15px;margin:0;accent-color:var(--draw)}
main{position:relative;min-width:0;min-height:0;background:var(--mat);border:1px solid var(--line);border-radius:6px;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
canvas.draw{cursor:crosshair}canvas.grab{cursor:grab}canvas.grabbing{cursor:grabbing}
*{-webkit-tap-highlight-color:transparent}
#app{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}input,select{-webkit-user-select:text;user-select:text}
.float{position:absolute;right:10px;bottom:10px;background:var(--mat);border:1px solid var(--line);border-radius:7px;padding:7px 9px;display:flex;flex-wrap:wrap;gap:7px;align-items:center;box-shadow:0 2px 8px rgba(20,40,50,.12)}
.float input{width:78px;height:30px;font:inherit;font-variant-numeric:tabular-nums;border:1px solid var(--line);border-radius:4px;padding:0 6px;background:var(--mat);color:var(--ink)}
.float button{min-height:30px;padding:0 11px;background:var(--active)}
.float button.on{box-shadow:inset 0 0 0 2px var(--draw);font-weight:600}
.float output{font-variant-numeric:tabular-nums;white-space:nowrap}
#matchPanel .a{color:var(--c4);font-weight:600}#matchPanel .b{color:var(--mark);font-weight:600}
#notice{position:absolute;left:10px;right:10px;top:8px;background:var(--panel);border:1px solid var(--line);padding:7px 11px;border-radius:6px}
#notice.warn{color:var(--danger)}
#status{display:flex;align-items:center;gap:16px;padding:5px 12px calc(5px + env(safe-area-inset-bottom));font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
#readout{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
#status span{color:var(--dim)}
#status #readout{color:var(--ink)}
@media (max-width:900px){
  #work,#work.noLeft,#work.noRight{grid-template-columns:minmax(0,1fr);position:relative}
  aside{position:absolute;z-index:5;top:0;bottom:0;width:min(250px,80vw);box-shadow:0 3px 14px rgba(20,40,50,.2)}
  #leftPanel{left:8px}#rightPanel{right:8px}
  #coord,#count{display:none}
}
/* 손가락 화면(폰·탭): 누르는 곳을 크게 */
@media (pointer:coarse){
  #quick button,#quick label.btn{width:42px;height:38px}
  #quick svg{width:21px;height:21px}
  .float button{min-height:38px}
  .float input{height:38px}
  select{height:32px}
  input[type=checkbox],input[type=radio]{width:19px;height:19px}
}
/* 폰 세로: 도구를 숨기지 않고 두 줄로 접는다 */
@media (max-width:600px){
  #ribbon{min-height:0;margin:2px 6px 0}
  .tabpane{flex-wrap:wrap}
  .group{padding:3px 3px;border-right:0}
  .group>span{display:none}
  .tool{min-width:46px;height:50px;padding:2px 3px;font-size:11px}
  .tool svg{width:21px;height:21px}
  #options{flex-wrap:wrap;gap:6px 12px;padding:5px 10px;white-space:normal}
  #work{padding:0 6px}
  .float{left:6px;right:6px;bottom:6px;padding:6px;gap:6px}
}
/* 폰 가로: 위쪽을 한 줄로 납작하게 해서 패턴 볼 자리를 넓힌다 */
@media (max-height:500px){
  #app>div:first-child{display:flex;align-items:center;gap:6px}
  #title{display:flex;padding:calc(2px + env(safe-area-inset-top)) 8px 0}
  #name{max-width:24vw}
  #tabs{padding:0}
  #tabs button{padding:4px 10px}
  #ribbon{min-height:0;margin:2px 6px 0}
  .group{padding:2px 4px}
  .group>span{display:none}
  .tool{flex-direction:row;gap:4px;height:36px;min-width:0;padding:2px 7px;font-size:12px}
  .tool svg{width:19px;height:19px}
  #options{padding:3px 10px}
  #status{padding-top:2px;padding-bottom:calc(2px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<div id="app">
<div>
  <div id="title">
    <div id="quick">
      <button id="new" title="새 패턴" aria-label="새 패턴"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v4h4"/></svg></button>
      <label class="btn" title="열기" aria-label="열기"><svg viewBox="0 0 24 24"><path d="M3 19V5h6l2 2h8v3M3 19l3-9h16l-3 9z"/></svg><input id="file" type="file" accept=".pax,.001,.002,.003,.004,.005" hidden></label>
      <button id="save" title="저장" aria-label="저장"><svg viewBox="0 0 24 24"><path d="M4 4h13l3 3v13H4zM8 4v6h8V4M8 20v-6h8v6"/></svg></button>
      <button id="undo" title="되돌리기 (Ctrl+Z)" aria-label="되돌리기" disabled><svg viewBox="0 0 24 24"><path d="M9 7L4 12l5 5M4 12h11a5 5 0 010 10"/></svg></button>
      <button id="redo" title="다시 실행 (Ctrl+Y)" aria-label="다시 실행" disabled><svg viewBox="0 0 24 24"><path d="M15 7l5 5-5 5M20 12H9a5 5 0 000 10"/></svg></button>
    </div>
    <div id="name"></div>
    <div></div>
  </div>
  <div id="tabs" role="tablist">
    <button role="tab" data-tab="file" aria-selected="false">파일</button>
    <button role="tab" data-tab="draw" aria-selected="true">그리기</button>
    <button role="tab" data-tab="view" aria-selected="false">보기</button>
  </div>
</div>
<nav id="ribbon">
  <div class="tabpane" data-pane="file" hidden>
    <div class="group"><div class="tools">
      <button class="tool" data-click="new"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v4h4"/></svg>새 패턴</button>
      <button class="tool" data-click="file"><svg viewBox="0 0 24 24"><path d="M3 19V5h6l2 2h8v3M3 19l3-9h16l-3 9z"/></svg>열기</button>
      <button class="tool" data-click="save"><svg viewBox="0 0 24 24"><path d="M4 4h13l3 3v13H4zM8 4v6h8V4M8 20v-6h8v6"/></svg>저장</button>
    </div><span>패턴 파일</span></div>
  </div>
  <div class="tabpane" data-pane="draw">
    <div class="group"><div class="tools">
      <button class="tool" data-tool="pan" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M5 3l14 9-6 1-3 6z"/></svg>선택</button>
    </div><span>선택</span></div>
    <div class="group"><div class="tools">
      <button class="tool" data-tool="line" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M5 19L19 5"/><circle cx="5" cy="19" r="1.5"/><circle cx="19" cy="5" r="1.5"/></svg>직선</button>
      <button class="tool" data-tool="box" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M5 6h14v12H5z"/></svg>박스</button>
      <button class="tool" data-tool="curve" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 19C8 4 14 20 20 5"/></svg>곡선</button>
      <button class="tool" data-tool="offset" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 18L18 4M8 21L21 8"/></svg>평행선</button>
      <button class="tool" data-tool="notch" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M3 15c6-2 12-2 18 0"/><path d="M12 8v10"/></svg>너치</button>
      <button class="tool" data-tool="text" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg>글자</button>
      <button class="tool" data-tool="seam" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/><path d="M3 3h18v18H3z" stroke-dasharray="2.5 2.5"/></svg>시접 넣기</button>
    </div><span>그리기</span></div>
    <div class="group"><div class="tools">
      <button class="tool" data-tool="edit" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 20l4-1L19 8l-3-3L5 16z"/><path d="M14 7l3 3"/></svg>수정</button>
      <button class="tool" data-tool="seamdel" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 7c4-3 12-3 16 0M5 16c4 3 10 3 14 0" stroke-dasharray="2.5 3"/><path d="M8 9l8 6M16 9l-8 6"/></svg>시접 삭제</button>
      <button class="tool" data-tool="move" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg>무브</button>
      <button class="tool" data-tool="cmove" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 4h10v10H4z"/><path d="M10 10h10v10H10z" stroke-dasharray="2.5 2"/></svg>시무브</button>
      <button class="tool" data-tool="mvrt" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-3-6.2"/><path d="M17 3v3h-3"/><path d="M9 12h6M12 9v6"/></svg>MVRT</button>
      <button class="tool" data-tool="sg" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z" stroke-dasharray="3 2"/><path d="M8 9h8M8 15h8"/></svg>SG</button>
      <button class="tool" data-tool="ag" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 4h12v12H4z" stroke-dasharray="3 2"/><path d="M18 14v8M14 18h8"/></svg>AG</button>
      <button class="tool" id="del" disabled><svg viewBox="0 0 24 24"><path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13"/></svg>지우기</button>
    </div><span>수정</span></div>
    <div class="group"><div class="tools">
      <button class="tool" data-tool="measure" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M3 16L16 3l5 5L8 21z"/><path d="M7 12l2 2M10 9l2 2M13 6l2 2"/></svg>재기</button>
      <button class="tool" data-tool="match" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M3 8h12M3 16h18"/><path d="M15 5v6M21 13v6"/></svg>길이 맞추기</button>
    </div><span>측정</span></div>
  </div>
  <div class="tabpane" data-pane="view" hidden>
    <div class="group"><div class="tools">
      <button class="tool" id="fitBtn"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>화면 맞춤</button>
      <button class="tool" id="zoomIn"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21M10.5 7.5v6M7.5 10.5h6"/></svg>확대</button>
      <button class="tool" id="zoomOut"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21M7.5 10.5h6"/></svg>축소</button>
    </div><span>화면</span></div>
    <div class="group"><div class="tools">
      <button class="tool" id="toggleLeft" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM10 5v14"/></svg>레이어 창</button>
      <button class="tool" id="toggleRight" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM14 5v14"/></svg>표시 창</button>
    </div><span>패널</span></div>
  </div>
</nav>
<div id="options">
  <label><input id="snapOn" type="checkbox" checked> 끝점 맞춤</label>
  <label><input id="gridOn" type="checkbox" checked> 격자</label>
  <label>선 종류
    <select id="lineKind"><option value="7">일반 선</option><option value="3">연한 선</option></select>
  </label>
  <label>곡선 수정
    <select id="curveMode"><option value="sa">SA 전체 자연스럽게</option><option value="ss">SS 한 점만</option></select>
  </label>
</div>
<div id="work">
  <aside id="leftPanel">
    <h2>레이어</h2>
    <div id="layerHead"><span>보기</span><span style="text-align:left">이름</span><span>요소</span><span>작업</span></div>
    <div id="layers"></div>
    <p class="hint">새로 그리는 선은 작업 레이어에 들어갑니다.</p>
  </aside>
  <main>
    <canvas id="c"></canvas>
    <div id="notice" hidden></div>
    <div id="editPanel" class="float" hidden>
      <label for="editLen">길이 cm</label><input id="editLen" type="number" inputmode="decimal" step="0.1" min="0">
      <button id="editApply">적용</button>
    </div>
    <div id="offsetPanel" class="float" hidden>
      <label for="gap">간격 cm</label><input id="gap" type="number" inputmode="decimal" step="0.1" min="0" value="1">
      <button id="sideA">이쪽</button><button id="sideB">반대쪽</button>
    </div>
    <div id="boxPanel" class="float" hidden>
      <label for="boxW">가로 cm</label><input id="boxW" type="number" inputmode="decimal" step="0.1" min="0">
      <label for="boxH">세로 cm</label><input id="boxH" type="number" inputmode="decimal" step="0.1" min="0">
      <button id="boxApply">적용</button>
    </div>
    <div id="movePanel" class="float" hidden>
      <output id="mvInfo"></output><label><input id="mvGroup" type="checkbox" checked> 그룹째</label>
      <button id="mvNext">다음</button><button id="mvAll">다시 고르기</button>
      <span id="mvXY"><label for="mvX">X cm</label><input id="mvX" type="number" inputmode="decimal" step="0.1"><label for="mvY">Y cm</label><input id="mvY" type="number" inputmode="decimal" step="0.1"><button id="mvApply">적용</button></span>
      <span id="mvR"><label for="mvAng">각도 °</label><input id="mvAng" type="number" inputmode="decimal" step="1" value="0"><button id="mvRot">적용</button></span>
    </div>
    <div id="textPanel" class="float" hidden>
      <input id="txt" type="text" placeholder="글자 (품번·사이즈 등)" style="width:170px">
      <label for="txtSize">크기 cm</label><input id="txtSize" type="number" inputmode="decimal" step="0.1" min="0.1" value="1" style="width:60px">
      <label for="txtRot">각도 °</label><input id="txtRot" type="number" inputmode="decimal" step="1" value="0" style="width:60px">
      <button id="txtAdd">넣기</button>
    </div>
    <div id="seamPickPanel" class="float" hidden>
      <output id="spInfo"></output><button id="spDone">한 바퀴 완성</button><button id="spReset">다시</button>
    </div>
    <div id="seamPanel" class="float" hidden>
      <output id="seamWhat"></output><label for="seamW">폭 cm</label><input id="seamW" type="number" inputmode="decimal" step="0.1" min="0.1" value="1">
      <button id="seamAll">모든 변에</button><button id="seamAdd">시접 넣기</button><button id="seamManual">직접 고르기</button>
    </div>
    <div id="notchPanel" class="float" hidden>
      <button id="notchEnd">시작점</button><label for="notchAt">에서 cm</label><input id="notchAt" type="number" inputmode="decimal" step="0.1" min="0">
      <label for="notchN">개수</label><input id="notchN" type="number" inputmode="numeric" step="1" min="1" max="10" value="1" style="width:52px">
      <label for="notchGap">간격 cm</label><input id="notchGap" type="number" inputmode="decimal" step="0.1" min="0.1" value="1" style="width:62px">
      <button id="notchAdd">너치 넣기</button>
    </div>
    <div id="matchPanel" class="float" hidden>
      <button id="matchA" class="on">기준</button><output id="sumA" class="a">0.00 cm</output>
      <button id="matchB">맞출 쪽</button><output id="sumB" class="b">0.00 cm</output>
      <output id="matchDiff"></output>
      <button id="matchFix" disabled>마지막 선으로 맞추기</button><button id="matchClear">다시</button>
    </div>
    <div id="input" class="float" hidden>
      <label for="len">길이 cm</label><input id="len" type="number" inputmode="decimal" step="0.1" min="0">
      <button id="apply">적용</button><button id="done" hidden>완료</button>
    </div>
  </main>
  <aside id="rightPanel">
    <h2>표시</h2>
    <h3>선</h3>
    <label class="row"><input type="checkbox" data-cat="line" checked> 직선</label>

  if(h.mv){inv.mv=h.mv.map(k=>({e:k.e,was:!k.e.kind&&S.edits.has(k.e),snap:{pts:k.e.pts,at:k.e.at,arc:k.e.arc,box:k.e.box}}));for(const k of h.mv){Object.assign(k.e,k.snap);mem(k.e,k.was)}}
  if(h.rg){inv.rg=h.rg.map(k=>({e:k.e,old:k.e.group,was:k.e.kind?null:S.regroup.has(k.e)}));for(const k of h.rg){k.e.group=k.old;if(k.was===false)S.regroup.delete(k.e);if(k.was===true)S.regroup.add(k.e)}}
  if(h.m){inv.m=h.m;inv.pts=h.m.pts.map(q=>({...q}));inv.was=S.edits.has(h.m);h.m.pts=h.pts;mem(h.m,h.was);if(S.sel===h.m&&h.pts.length===2)$('editLen').value=lenOf(h.pts).toFixed(2)}
  return inv;
}
$('undo').onclick=()=>{const h=S.hist.pop();if(!h)return;S.redo.push(revert(h));S.ver++;S.hl=null;refresh()};
$('redo').onclick=()=>{const h=S.redo&&S.redo.pop();if(!h)return;S.redoing=true;S.hist.push(revert(h));S.redoing=false;S.hl=null;refresh()};
// Closing the tab or the DeX window with unsaved changes asks first.
addEventListener('beforeunload',e=>{if(dirty()){e.preventDefault();e.returnValue=''}});
// Phones and tablets: share sheet ("파일에 저장"); PC: normal download.
const MOBILE=/iPad|iPhone|Android/.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Macintosh/.test(navigator.userAgent));
function download(blob,fname){
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname;
  document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  say('새 파일로 저장했습니다. 원본은 그대로입니다.');
}
$('save').onclick=()=>{
  let out;
  try{out=build(S.doc,S.adds,S.dels,[...S.edits].filter(e=>!S.dels.includes(e.rec)),[...S.regroup].filter(e=>!S.dels.includes(e.rec)).map(e=>({rec:e.rec,group:e.group})));S.savedVer=S.ver;refresh()}
  catch(err){return say(err.message,true)}
  const fname=S.name.replace(/[^\w가-힣-]/g,'_')+'_edit.pax',blob=new Blob([out],{type:'application/octet-stream'});
  let file=null;try{file=new File([blob],fname,{type:'application/octet-stream'})}catch(e){}
  if(MOBILE&&file&&navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file]})
      .then(()=>say('새 파일로 저장했습니다. 원본은 그대로입니다.'))
      .catch(err=>{if(err&&err.name==='AbortError')say('저장을 취소했습니다.');else download(blob,fname)});
  }else download(blob,fname);
};
$('editApply').onclick=()=>{
  const e=S.sel,L=parseFloat($('editLen').value);if(!e||e.pts.length!==2)return;
  if(!(L>0))return say('길이를 cm로 입력해 주세요.',true);
  const [a,b]=e.pts,d=Math.hypot(b.x-a.x,b.y-a.y)||1;
  remember(e);e.pts=[a,{x:a.x+(b.x-a.x)/d*L,y:a.y+(b.y-a.y)/d*L}];changed(e);say('');readout('길이 '+L.toFixed(2)+' cm');refresh();
};
$('sideA').onclick=()=>makeOffset(1);$('sideB').onclick=()=>makeOffset(-1);
document.querySelectorAll('#tabs [data-tab]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#tabs [data-tab]').forEach(t=>t.setAttribute('aria-selected',t===b));
  document.querySelectorAll('.tabpane').forEach(p=>p.hidden=p.dataset.pane!==b.dataset.tab);
});
document.querySelectorAll('[data-click]').forEach(b=>b.onclick=()=>$(b.dataset.click).click());
document.querySelectorAll('[data-cat]').forEach(b=>b.onchange=()=>{b.checked?S.off.delete(b.dataset.cat):S.off.add(b.dataset.cat);S.sel=null;refresh()});
$('snapOn').onchange=()=>{S.snap=null;draw()};$('gridOn').onchange=draw;
$('fitBtn').onclick=()=>{fit();draw()};
$('zoomIn').onclick=()=>zoom(1.25,S.w/2,S.h/2);$('zoomOut').onclick=()=>zoom(.8,S.w/2,S.h/2);
function togglePanel(btn,cls){const w=$('work'),off=w.classList.toggle(cls);btn.setAttribute('aria-pressed',!off);resize()}
$('toggleLeft').onclick=()=>togglePanel($('toggleLeft'),'noLeft');
$('toggleRight').onclick=()=>togglePanel($('toggleRight'),'noRight');
if(innerWidth<=900){$('toggleLeft').click();$('toggleRight').click()}
let lastKey='',lastAt=0,spaceDown=false;
// Enter in a box applies it (DeX keyboard).
const ENTER={len:'apply',editLen:'editApply',gap:'sideA',notchAt:'notchAdd',notchN:'notchAdd',notchGap:'notchAdd',seamW:'seamAdd',txt:'txtAdd',txtSize:'txtAdd',txtRot:'txtAdd',boxW:'boxApply',boxH:'boxApply',mvX:'mvApply',mvY:'mvApply',mvAng:'mvRot'};
addEventListener('keydown',e=>{
  const typing=e.target.matches&&e.target.matches('input,select,textarea'),ctrl=e.ctrlKey||e.metaKey,k=(e.key||'').toLowerCase();
  if(ctrl&&k==='s'){e.preventDefault();$('save').click();return}
  if(ctrl&&k==='o'){e.preventDefault();$('file').click();return}
  if(typing){
    if(e.key==='Enter'){const b=ENTER[e.target.id];if(b&&$(b).offsetParent!==null){e.preventDefault();$(b).click()}}
    else if(e.key==='Escape')e.target.blur();
    return;
  }
  if(ctrl&&(k==='y'||(k==='z'&&e.shiftKey))){e.preventDefault();$('redo').click();return}
  if(ctrl&&k==='z'){e.preventDefault();$('undo').click();return}
  if(ctrl&&k==='0'){e.preventDefault();fit();draw();return}
  if(e.key===' '){e.preventDefault();if(!spaceDown){spaceDown=true;cursor()}return}
  if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();if(!$('del').disabled)$('del').click();return}
  if(e.key==='Escape'){cancelAll();return}
  if(e.key==='Home'){fit();draw();return}
  if(e.key==='+'||e.key==='='){zoom(1.25,S.w/2,S.h/2);return}
  if(e.key==='-'||e.key==='_'){zoom(.8,S.w/2,S.h/2);return}
  const arrow={ArrowLeft:[60,0],ArrowRight:[-60,0],ArrowUp:[0,60],ArrowDown:[0,-60]}[e.key];
  if(arrow){e.preventDefault();S.view.x+=arrow[0];S.view.y+=arrow[1];draw();return}
  if(ctrl||e.altKey||k.length!==1)return;
  // Yuka-style two-letter keys
  const now=Date.now(),seq=now-lastAt<1000?lastKey+k:'';lastKey=k;lastAt=now;
  if(seq==='ss'||seq==='sa'){lastKey='';$('curveMode').value=seq;document.querySelector('[data-tool=edit]').click();readout(seq==='ss'?'SS: 곡선을 누르고 점 하나를 옮기세요':'SA: 곡선을 누르고 점을 끌면 전체가 자연스럽게 따라옵니다');return}
  if(seq==='sg'||seq==='ag'){lastKey='';document.querySelector('[data-tool='+seq+']').click();return}
});
addEventListener('keyup',e=>{if(e.key===' '){spaceDown=false;cursor()}});
addEventListener('blur',()=>{if(spaceDown){spaceDown=false;cursor()}});
let wideNow=innerWidth>900;
addEventListener('resize',()=>{
  const wide=innerWidth>900,w=$('work');
  if(wide!==wideNow){wideNow=wide;for(const [btn,cls] of [['toggleLeft','noLeft'],['toggleRight','noRight']])if(w.classList.contains(cls)===wide)$(btn).click()}
  resize();
});
window.__pax={parse,build,blank};
// iPad/iPhone grey out unknown extensions like .pax in the file picker, so allow any file there;
// parse() still rejects anything that isn't a Yuka file.
if(/iPad|iPhone/.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Macintosh/.test(navigator.userAgent)))$('file').removeAttribute('accept');
// Offline + install support. A new version takes over on its own; then offer a reload
// (not forced, so unsaved work is never lost).
if('serviceWorker' in navigator&&location.protocol!=='file:'){
  const hadController=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(!hadController)return; // very first install: nothing to refresh
    const n=$('notice');say('새 버전이 준비됐습니다. 여기를 누르면 새로고침합니다. (저장 안 한 작업은 먼저 저장하세요)');
    n.style.cursor='pointer';n.onclick=()=>location.reload();
  });
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
// Opens on an empty pattern.
load(blank(),'새 패턴');
addEventListener('load',()=>{resize();fit();refresh();readout()});
resize();fit();refresh();readout();
</script>
